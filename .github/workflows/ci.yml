name: ci

on:
  push:
    branches: [main]

# Domyślnie GITHUB_TOKEN może tylko czytać repozytorium - więcej dostaje tylko job, który tego potrzebuje
permissions:
  contents: read

# Baza w CI istnieje kilka minut i zawiera tylko próbkę - to nie są prawdziwe sekrety
env:
  POSTGRES_DB: breachdb
  POSTGRES_USER: breach
  POSTGRES_PASSWORD: haslo-tylko-dla-ci

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Uruchom backend (konfiguracja dev) i bazę
        run: docker compose up -d --build --wait backend
      - name: Testy
        run: docker compose exec -T backend pytest -v
      - name: Logi przy błędzie
        if: failure()
        run: docker compose logs



  build-and-push:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Nazwa obrazu (w nazwie obrazu tylko małe litery)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/breach-checker-backend" >> "$GITHUB_ENV"
      - name: Logowanie do GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Budowanie obrazu produkcyjnego
        run: docker build -t "$IMAGE:$GITHUB_SHA" backend
      - name: Publikacja
        run: docker push "$IMAGE:$GITHUB_SHA"

  build-frontend:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Nazwa obrazu
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/breach-checker-frontend" >> "$GITHUB_ENV"
      - name: Logowanie do GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Budowanie obrazu produkcyjnego (z lintem)
        run: docker build -t "$IMAGE:$GITHUB_SHA" frontend
      - name: Publikacja
        run: docker push "$IMAGE:$GITHUB_SHA"


  verify:
    needs: [build-and-push, build-frontend]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      # Bez docker-compose.override.yml (konfiguracja produkcyjna) + backend z rejestru
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Nazwa obrazu z tego commita
        run: echo "BACKEND_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/breach-checker-backend:$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Nazwa obrazu frontendu
        run: echo "FRONTEND_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/breach-checker-frontend:$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Logowanie do GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Pobranie obrazu z rejestru
        run: docker compose pull backend frontend
      - name: Uruchomienie całego projektu
        run: docker compose up -d --wait
      - name: Test dymny - zapytania przez frontend, jak z przeglądarki
        run: |
          curl --fail -sS http://localhost:8080/
          curl --fail -sS http://localhost:8080/api/health
          curl --fail -sS -X POST -H "Content-Type: application/json" \
            -d '{"hash":"7c4a8d09ca3762af61e59520943dc26494f8941b"}' \
            http://localhost:8080/api/check | grep '"found":true'
      - name: Logi przy błędzie
        if: failure()
        run: docker compose logs


  promote:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Logowanie do GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Tag latest dla obu obrazów
        run: |
          for name in backend frontend; do
            IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/breach-checker-$name"
            docker pull "$IMAGE:$GITHUB_SHA"
            docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          done